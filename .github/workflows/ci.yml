name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  luau:
    name: Luau syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch luau-compile
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o luau.zip luau-compile
          chmod +x luau-compile

      - name: Compile every Luau file
        run: |
          status=0
          while IFS= read -r file; do
            if ./luau-compile --binary "$file" > /dev/null; then
              echo "ok   $file"
            else
              echo "::error file=$file::Luau syntax error"
              status=1
            fi
          done < <(find src -name '*.luau' | sort)
          exit $status

  project:
    name: Rojo project file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default.project.json
        run: python3 -c "import json; json.load(open('default.project.json')); print('default.project.json is valid JSON')"
